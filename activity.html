<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>active</title>
    <link rel="stylesheet" href="activity.css" />
  </head>
  <body>
    <!-- 네비바 -->
    <header class="navbar">
      <h1 class="logo">하와이로(路)</h1>
      <nav>
        <ul class="nav-links">
          <li><a href="#">명소</a></li>
          <li><a href="#">음식</a></li>
          <li><a href="#" class="active">액티비티</a></li>
          <li><a href="#">숙소</a></li>
          <li><a href="#">패션</a></li>
        </ul>
      </nav>
      <div class="login-btn">로그인</div>
    </header>

    <section class="banner">
      <h2 class="title-font">
        에메랄드 빛 하와이에서 만나는<br />신나는 액티비티
      </h2>
    </section>

    <!-- 섬별 링크 -->
    <main>
      <section class="island">
        <ul class="active">
          <li>
            <a href="#">전체</a>
          </li>

          <li>
            <a
              href="https://www.waug.com/ko/search?keyword=%EC%98%A4%EC%95%84%ED%9B%84&click_search=true&parentCategoryId=4"
              target="_blank"
              >오아후</a
            >
          </li>
          <li>
            <a
              href="https://www.waug.com/ko/search?keyword=%EB%A7%88%EC%9A%B0%EC%9D%B4&click_search=true&parentCategoryId=4"
              target="_blank"
              >마우이</a
            >
          </li>
          <li>
            <a
              href="https://www.waug.com/ko/search?keyword=%EB%B9%85%EC%95%84%EC%9D%BC%EB%9E%9C%EB%93%9C&click_search=true&parentCategoryId=4"
              target="_blank"
              >빅아일랜드</a
            >
          </li>
          <li>
            <a
              href="https://www.waug.com/ko/search?keyword=%EC%B9%B4%EC%9A%B0%EC%95%84%EC%9D%B4&click_search=true"
              target="_blank"
              >카우아이</a
            >
          </li>

          <li>
            <a
              href="https://www.waug.com/ko/search?keyword=%EB%AA%B0%EB%A1%9C%EC%B9%B4%EC%9D%B4&click_search=true"
              >몰로카이</a
            >
          </li>
          <li>
            <a
              href="https://www.waug.com/ko/search?keyword=%EB%9D%BC%EB%82%98%EC%9D%B4&click_search=true"
              >라나이</a
            >
          </li>
        </ul>
      </section>

      <!-- 대표 액티비티 6개 grid -->
      <div class="main-layout">
        <section class="activity-content">
          <div class="activity-header">
            <h3 class="section-title" style="margin-bottom: 0">
              추천 액티비티
            </h3>
            <a
              href="https://www.waug.com/ko/areas/64/categories/4"
              target="_blank"
              class="more-btn"
              >+ 더보기</a
            >
          </div>

          <div class="activity-grid">
            <a href="https://www.waug.com/ko/activities/129643" target="_blank">
              <div class="activity-card">
                <img src="1.png" alt="무동력 글라이더" />
              </div>
            </a>

            <a href="https://www.waug.com/ko/activities/132499" target="_blank">
              <div class="activity-card">
                <img src="2.png" alt="서핑 레슨" />
              </div>
            </a>

            <a href="https://www.waug.com/ko/activities/132624" target="_blank">
              <div class="activity-card">
                <img src="3.png" alt="스카이 다이빙" />
              </div>
            </a>

            <a href="https://www.waug.com/ko/activities/127435" target="_blank">
              <div class="activity-card">
                <img src="4.png" alt="상어" />
              </div>
            </a>

            <a href="https://www.waug.com/ko/activities/139295" target="_blank">
              <div class="activity-card">
                <img src="5.png" alt="골프" />
              </div>
            </a>

            <a href="https://www.waug.com/ko/activities/133188" target="_blank">
              <div class="activity-card">
                <img src="6.png" alt="헬리콥터" />
              </div>
            </a>
          </div>
        </section>

        <!-- 체크리스트 -->
        <section class="checklist-section">
          <h3 class="section-title">여행 준비 체크리스트</h3>

          <div class="checklist-container">
            <div class="check-box-group">
              <h4>🌊 준비물</h4>
              <label
                ><input type="checkbox" />예약 확정 바우처, 신분증(여권 또는
                영문운전면허증)</label
              >
              <label><input type="checkbox" /> 비상약 </label>
              <label
                ><input type="checkbox" /> 수영복, 타월
                <a
                  href="https://www.coupang.com/np/search?component=&q=수영복"
                  target="_blank"
                  class="shop-link"
                  >구매 🛒</a
                ></label
              >
              <label
                ><input type="checkbox" /> 산호초 무해 선크림, 모자, 선글라스
                <a
                  href="https://www.coupang.com/np/search?component=&q=무기자차선크림"
                  target="_blank"
                  class="shop-link"
                  >구매 🛒</a
                ></label
              >
              <label
                ><input type="checkbox" /> 아쿠아슈즈, 샌들
                <a
                  href="https://www.coupang.com/np/search?component=&q=아쿠아슈즈"
                  target="_blank"
                  class="shop-link"
                  >구매 🛒</a
                ></label
              >
            </div>

            <div class="check-box-group">
              <h4>📝 직접 입력 (추가)</h4>
              <div class="add-item">
                <input
                  type="text"
                  id="custom-item"
                  placeholder="필요한 준비물을 적어보세요"
                />
                <button onclick="addItem()" class="add-btn">추가</button>
              </div>
              <div id="custom-list"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
    <!-- 추가한 체크리스트 생성 -->
    <!-- <script>
      function addItem() {
        const input = document.getElementById("custom-item");
        const list = document.getElementById("custom-list");

        if (input.value.trim() !== "") {
          // 새로운 라벨과 체크박스 생성
          const newLabel = document.createElement("label");
          newLabel.innerHTML = `<input type="checkbox"> ${input.value}`;
          list.appendChild(newLabel);
          input.value = ""; // 입력창 비우기
        }
      }
    </script> -->
  </body>
</html>
